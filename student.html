<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Hostel Store | Student</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script src="firebase.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

/* HEADER */

.header {
    background: white;
    border-bottom: 1px solid #ddd;
    padding: 15px 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.logo span {
    color: #2563eb;
}

.logout {
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;

    padding: 9px 15px;

    cursor: pointer;

    font-weight: bold;
}

/* MAIN */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 25px 15px 50px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #667085;
    margin-top: 0;
}

/* MESSAGE */

#message {
    display: none;
    padding: 12px;
    margin: 15px 0;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.success {
    display: block !important;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block !important;
    background: #fee2e2;
    color: #991b1b;
}

/* PRODUCTS */

.products {
    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(230px, 1fr));

    gap: 18px;

    margin-top: 25px;
}

.product {
    background: white;

    border: 1px solid #ddd;

    border-radius: 14px;

    padding: 18px;

    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}

.product-icon {
    width: 60px;
    height: 60px;

    background: #eff6ff;

    border-radius: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;

    margin-bottom: 12px;
}

.product-name {
    font-size: 18px;
    font-weight: bold;
}

.product-category {
    color: #667085;
    font-size: 13px;

    margin-top: 4px;
}

.price {
    font-size: 18px;
    font-weight: bold;

    margin-top: 15px;
}

.stock {
    margin-top: 8px;

    font-size: 13px;

    font-weight: bold;
}

.available {
    color: #16a34a;
}

.soldout {
    color: #dc2626;
}

.empty {
    background: white;

    padding: 40px;

    text-align: center;

    border: 1px dashed #bbb;

    border-radius: 12px;

    color: #667085;
}

.loading {
    text-align: center;

    padding: 40px;

    color: #667085;
}


/* MOBILE */

@media(max-width:600px) {

    .container {
        padding: 20px 12px 40px;
    }

    .products {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="logo">

        🏪 <span>Hostel Store</span>

    </div>


    <button
        id="logoutButton"
        class="logout">

        Logout

    </button>

</div>


<!-- MAIN -->

<div class="container">


<h1>Student Store</h1>

<p class="subtitle">
Available products in the hostel store.
</p>


<div id="message"></div>


<div
    id="productsContainer"
    class="products">

    <div class="loading">

        Loading products...

    </div>

</div>


</div>


<script>


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className = type;

}


/* ==========================================
   CHECK LOGIN
========================================== */

auth.onAuthStateChanged(function(user) {

    console.log("Student auth state:", user);


    if (!user) {

        window.location.replace("index.html");

        return;

    }


    console.log(
        "Student logged in:",
        user.uid
    );


    loadProducts();

});


/* ==========================================
   LOGOUT
========================================== */

document
    .getElementById("logoutButton")
    .addEventListener("click", async function() {

        try {

            console.log("Logging out...");

            await auth.signOut();

            console.log("Logout successful");

            window.location.replace("index.html");

        }

        catch (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "Logout failed:\n\n" +
                error.code +
                "\n\n" +
                error.message
            );

        }

    });


/* ==========================================
   LOAD PRODUCTS
========================================== */

function loadProducts() {

    console.log("Loading products...");


    db
        .collection("products")
        .onSnapshot(

            function(snapshot) {

                console.log(
                    "Products found:",
                    snapshot.size
                );


                const container =
                    document.getElementById(
                        "productsContainer"
                    );


                container.innerHTML = "";


                let count = 0;


                snapshot.forEach(function(doc) {

                    const product =
                        doc.data();


                    console.log(
                        "Product:",
                        doc.id,
                        product
                    );


                    const stock =
                        Number(
                            product.stock || 0
                        );


                    /*
                       Show only products that
                       have stock available.
                    */

                    if (
                        product.available === true &&
                        stock > 0
                    ) {

                        createProduct(
                            doc.id,
                            product
                        );

                        count++;

                    }

                });


                if (count === 0) {

                    container.innerHTML = `

                        <div class="empty">

                            No products are
                            currently available.

                            <br><br>

                            Please check again later.

                        </div>

                    `;

                }

            },


            function(error) {

                console.error(
                    "Product loading error:",
                    error
                );


                showMessage(
                    "Unable to load products: " +
                    error.message,
                    "error"
                );

            }

        );

}


/* ==========================================
   CREATE PRODUCT
========================================== */

function createProduct(id, product) {

    const container =
        document.getElementById(
            "productsContainer"
        );


    const card =
        document.createElement("div");


    card.className = "product";


    const stock =
        Number(
            product.stock || 0
        );


    card.innerHTML = `

        <div class="product-icon">

            ${escapeHTML(
                product.icon || "🛍️"
            )}

        </div>


        <div class="product-name">

            ${escapeHTML(
                product.name || "Product"
            )}

        </div>


        <div class="product-category">

            ${escapeHTML(
                product.category || "General"
            )}

        </div>


        <div class="price">

            ₹${Number(
                product.price || 0
            ).toFixed(2)}

        </div>


        <div class="stock available">

            🟢 ${stock} available

        </div>

    `;


    container.appendChild(card);

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>


</body>

</html>
