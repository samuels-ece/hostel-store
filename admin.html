<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Hostel Store - Admin</title>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<!-- Your Firebase configuration -->
<script src="firebase.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

/* HEADER */

.header {
    background: white;
    padding: 15px 20px;
    border-bottom: 1px solid #ddd;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.logo span {
    color: #2563eb;
}

.logout {
    background: white;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 9px 15px;
    cursor: pointer;
    font-weight: bold;
}

.logout:active {
    transform: scale(0.97);
}

/* MAIN */

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px 15px 50px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #667085;
    margin-top: 0;
}

/* MESSAGE */

#message {
    display: none;
    padding: 12px;
    margin: 15px 0;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.success {
    display: block !important;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block !important;
    background: #fee2e2;
    color: #991b1b;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 25px 0;
}

.stat {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 18px;
}

.stat-title {
    font-size: 12px;
    color: #667085;
}

.stat-number {
    font-size: 25px;
    font-weight: bold;
    margin-top: 7px;
}

/* CARD */

.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 25px;
}

.card h2 {
    margin-top: 0;
}

/* FORM */

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 14px;
}

.add-button {
    width: 100%;
    margin-top: 18px;
    padding: 13px;

    border: none;
    border-radius: 8px;

    background: #2563eb;
    color: white;

    font-weight: bold;
    font-size: 14px;

    cursor: pointer;
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(230px, 1fr));
    gap: 15px;
}

.product {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 15px;
    background: white;
}

.product-icon {
    font-size: 35px;
    margin-bottom: 8px;
}

.product-name {
    font-weight: bold;
    font-size: 17px;
}

.product-category {
    color: #667085;
    font-size: 12px;
    margin: 4px 0 15px;
}

.product-info {
    margin-bottom: 12px;
}

.product-info strong {
    font-size: 14px;
}

.product input {
    margin-bottom: 8px;
}

.update {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 7px;
    background: #172033;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.delete {
    width: 100%;
    padding: 9px;
    margin-top: 7px;
    border: 1px solid #ef4444;
    border-radius: 7px;
    background: white;
    color: #dc2626;
    font-weight: bold;
    cursor: pointer;
}

.empty {
    padding: 30px;
    text-align: center;
    color: #667085;
    border: 1px dashed #bbb;
    border-radius: 10px;
}

/* MOBILE */

@media(max-width:600px) {

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .products {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <div class="logo">
        🏪 <span>Hostel Store</span>
        <small> | ADMIN</small>
    </div>

    <div style="display:flex; gap:8px;">

    <button
        class="logout"
        onclick="openOrders()">

        📦 Orders

    </button>

    <button
        class="logout"
        id="logoutButton">

        Logout

    </button>

    </div>

</div>


<div class="container">


<h1>Store Management</h1>

<p class="subtitle">
Add products and manage your hostel store stock.
</p>


<!-- MESSAGE -->

<div id="message"></div>


<!-- STATS -->

<div class="stats">

    <div class="stat">

        <div class="stat-title">
            TOTAL PRODUCTS
        </div>

        <div
            class="stat-number"
            id="totalProducts">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            AVAILABLE
        </div>

        <div
            class="stat-number"
            id="availableProducts">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            SOLD OUT
        </div>

        <div
            class="stat-number"
            id="soldOutProducts">

            0

        </div>

    </div>

</div>


<!-- ADD PRODUCT -->

<div class="card">

<h2>Add New Product</h2>


<form id="productForm">


<div class="form-grid">


<div>

<label>Product Name</label>

<input
    type="text"
    id="productName"
    placeholder="Example: Dairy Milk"
    required>

</div>


<div>

<label>Category</label>

<input
    type="text"
    id="productCategory"
    placeholder="Example: Chocolate"
    required>

</div>


<div>

<label>Price (₹)</label>

<input
    type="number"
    id="productPrice"
    placeholder="40"
    min="0"
    step="0.01"
    required>

</div>


<div>

<label>Stock</label>

<input
    type="number"
    id="productStock"
    placeholder="10"
    min="0"
    required>

</div>


<div>

<label>Icon / Emoji</label>

<input
    type="text"
    id="productIcon"
    placeholder="🍫">

</div>


</div>


<button
    type="submit"
    class="add-button"
    id="addButton">

    + ADD PRODUCT

</button>


</form>

</div>


<!-- PRODUCTS -->

<div class="card">

<h2>Manage Products</h2>

<div
    id="productsContainer"
    class="products">

    <div class="empty">
        Loading products...
    </div>

</div>

</div>


</div>


<script>


/* ==========================================
   SHOW MESSAGE
========================================== */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className = type;

    setTimeout(function() {

        message.className = "";

        message.textContent = "";

    }, 4000);

}


/* ==========================================
   CHECK ADMIN LOGIN
========================================== */

auth.onAuthStateChanged(async function(user) {

    console.log("Current user:", user);

    if (!user) {

        window.location.replace("index.html");

        return;

    }


    try {

        const userDoc =
            await db
                .collection("users")
                .doc(user.uid)
                .get();


        if (!userDoc.exists) {

            alert(
                "Admin profile not found in Firestore."
            );

            await auth.signOut();

            window.location.replace("index.html");

            return;

        }


        const userData =
            userDoc.data();


        console.log(
            "Firestore user:",
            userData
        );


        if (userData.role !== "admin") {

            alert(
                "Access denied. This account is not an admin."
            );

            await auth.signOut();

            window.location.replace("index.html");

            return;

        }


        console.log("ADMIN VERIFIED");

        loadProducts();


    } catch (error) {

        console.error(
            "Admin verification error:",
            error
        );

        showMessage(
            "Admin verification failed: " +
            error.message,
            "error"
        );

    }

});


/* ==========================================
   LOGOUT
========================================== */

document
    .getElementById("logoutButton")
    .addEventListener("click", async function() {

        try {

            await auth.signOut();

            window.location.replace("index.html");

        } catch (error) {

            console.error(
                "Logout error:",
                error
            );

            alert(
                "Logout failed:\n" +
                error.message
            );

        }

    });


/* ==========================================
   ADD PRODUCT
========================================== */

document
    .getElementById("productForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("productName")
                .value
                .trim();


        const category =
            document
                .getElementById("productCategory")
                .value
                .trim();


        const price =
            Number(
                document
                    .getElementById("productPrice")
                    .value
            );


        const stock =
            Number(
                document
                    .getElementById("productStock")
                    .value
            );


        const icon =
            document
                .getElementById("productIcon")
                .value
                .trim();


        if (!name || !category) {

            showMessage(
                "Please enter product name and category.",
                "error"
            );

            return;

        }


        if (price < 0 || stock < 0) {

            showMessage(
                "Price and stock cannot be negative.",
                "error"
            );

            return;

        }


        const button =
            document.getElementById("addButton");


        button.disabled = true;

        button.textContent =
            "ADDING...";


        try {

            const user =
                auth.currentUser;


            if (!user) {

                throw new Error(
                    "You are not logged in."
                );

            }


            console.log(
                "Adding product as:",
                user.uid
            );


            const userDoc =
                await db
                    .collection("users")
                    .doc(user.uid)
                    .get();


            if (!userDoc.exists) {

                throw new Error(
                    "Admin profile does not exist."
                );

            }


            if (
                userDoc.data().role !== "admin"
            ) {

                throw new Error(
                    "Your account is not an admin."
                );

            }


            await db
                .collection("products")
                .add({

                    name: name,

                    category: category,

                    price: price,

                    stock: stock,

                    available: stock > 0,

                    icon: icon || "🛍️",

                    createdAt:
                        firebase.firestore
                        .FieldValue
                        .serverTimestamp()

                });


            showMessage(
                "✅ Product added successfully!",
                "success"
            );


            document
                .getElementById("productForm")
                .reset();


        } catch (error) {

            console.error(
                "ADD PRODUCT ERROR:",
                error
            );


            showMessage(
                "❌ " +
                error.code +
                ": " +
                error.message,
                "error"
            );


            alert(
                "Product could not be added.\n\n" +
                "Error code: " +
                error.code +
                "\n\n" +
                error.message
            );

        }


        button.disabled = false;

        button.textContent =
            "+ ADD PRODUCT";

    });


/* ==========================================
   LOAD PRODUCTS
========================================== */

function loadProducts() {

    db
        .collection("products")
        .onSnapshot(

            function(snapshot) {

                const container =
                    document.getElementById(
                        "productsContainer"
                    );


                container.innerHTML = "";


                let available = 0;

                let soldOut = 0;


                snapshot.forEach(function(doc) {

                    const product =
                        doc.data();


                    const stock =
                        Number(
                            product.stock || 0
                        );


                    if (
                        product.available === true &&
                        stock > 0
                    ) {

                        available++;

                    } else {

                        soldOut++;

                    }


                    createProduct(
                        doc.id,
                        product
                    );

                });


                document.getElementById(
                    "totalProducts"
                ).textContent =
                    snapshot.size;


                document.getElementById(
                    "availableProducts"
                ).textContent =
                    available;


                document.getElementById(
                    "soldOutProducts"
                ).textContent =
                    soldOut;


                if (snapshot.empty) {

                    container.innerHTML = `

                        <div class="empty">

                            No products yet.

                            <br><br>

                            Add your first product above.

                        </div>

                    `;

                }

            },


            function(error) {

                console.error(
                    "PRODUCT LOAD ERROR:",
                    error
                );


                showMessage(
                    "Could not load products: " +
                    error.message,
                    "error"
                );

            }

        );

}


/* ==========================================
   CREATE PRODUCT CARD
========================================== */

function createProduct(id, product) {

    const container =
        document.getElementById(
            "productsContainer"
        );


    const card =
        document.createElement("div");


    card.className = "product";


    const stock =
        Number(
            product.stock || 0
        );


    card.innerHTML = `

        <div class="product-icon">

            ${escapeHTML(
                product.icon || "🛍️"
            )}

        </div>


        <div class="product-name">

            ${escapeHTML(
                product.name || "Product"
            )}

        </div>


        <div class="product-category">

            ${escapeHTML(
                product.category || "General"
            )}

        </div>


        <div class="product-info">

            <strong>
                ₹${Number(
                    product.price || 0
                ).toFixed(2)}
            </strong>

            &nbsp; | &nbsp;

            Stock: ${stock}

        </div>


        <input
            type="number"
            min="0"
            id="stock-${id}"
            value="${stock}"
            placeholder="Stock">


        <button
            class="update"
            onclick="updateProduct('${id}')">

            SAVE CHANGES

        </button>


        <button
            class="delete"
            onclick="deleteProduct('${id}')">

            DELETE PRODUCT

        </button>

    `;


    container.appendChild(card);

}


/* ==========================================
   UPDATE PRODUCT
========================================== */

async function updateProduct(id) {

    const stock =
        Number(
            document
                .getElementById("stock-" + id)
                .value
        );


    if (stock < 0) {

        showMessage(
            "Stock cannot be negative.",
            "error"
        );

        return;

    }


    try {

        await db
            .collection("products")
            .doc(id)
            .update({

                stock: stock,

                available: stock > 0

            });


        showMessage(
            "✅ Stock updated successfully!",
            "success"
        );


    } catch (error) {

        console.error(error);

        alert(
            "Update failed:\n\n" +
            error.code +
            "\n" +
            error.message
        );

    }

}


/* ==========================================
   DELETE PRODUCT
========================================== */

async function deleteProduct(id) {

    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }


    try {

        await db
            .collection("products")
            .doc(id)
            .delete();


        showMessage(
            "Product deleted.",
            "success"
        );


    } catch (error) {

        console.error(error);

        alert(
            "Delete failed:\n\n" +
            error.code +
            "\n" +
            error.message
        );

    }

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}
      function openOrders() {

    window.location.href = "orders.html";

      }

</script>

</body>

</html>
