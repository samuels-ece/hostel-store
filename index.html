<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hostel Store | Login</title>

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <script src="firebase.js"></script>
</head>

<body>

<div class="container">

    <div class="logo-section">

        <div class="logo">
            🏪
        </div>

        <h1>Hostel Store</h1>

        <p>Check Before You Go</p>

    </div>


    <div class="card">

        <h2>Welcome Back</h2>

        <p class="subtitle">
            Login to check what's available today
        </p>


        <div class="role-buttons">

            <button
                class="role-button active"
                id="studentBtn"
                onclick="selectRole('student')">

                👨‍🎓 Student

            </button>

            <button
                class="role-button"
                id="adminBtn"
                onclick="selectRole('admin')">

                👑 Admin

            </button>

        </div>


        <div id="message" class="message"></div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()">

                        👁

                    </button>

                </div>

            </div>


            <div class="forgot">

                <a href="#" onclick="resetPassword()">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="primary-button"
                id="loginButton">

                LOGIN

            </button>

        </form>


        <div class="bottom-text" id="signupSection">

            Don't have an account?

            <a href="signup.html">
                Sign Up
            </a>

        </div>

    </div>

</div>


<script>

let selectedRole = "student";


function selectRole(role) {

    selectedRole = role;

    const studentBtn =
        document.getElementById("studentBtn");

    const adminBtn =
        document.getElementById("adminBtn");

    const signupSection =
        document.getElementById("signupSection");


    if (role === "student") {

        studentBtn.classList.add("active");

        adminBtn.classList.remove("active");

        signupSection.style.display = "block";

    } else {

        adminBtn.classList.add("active");

        studentBtn.classList.remove("active");

        signupSection.style.display = "none";

    }

}


function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className = "message " + type;

}


function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}


document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const loginButton =
        document.getElementById("loginButton");


    loginButton.disabled = true;

    loginButton.textContent = "LOGGING IN...";

    showMessage("", "");


    try {

        const userCredential =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );


        const user =
            userCredential.user;


        const userDoc =
            await db.collection("users")
                    .doc(user.uid)
                    .get();


        if (!userDoc.exists) {

            await auth.signOut();

            throw new Error(
                "User profile not found."
            );

        }


        const userData =
            userDoc.data();


        if (userData.role !== selectedRole) {

            await auth.signOut();

            throw new Error(
                "You selected the wrong login type."
            );

        }


        showMessage(
            "Login successful! Redirecting...",
            "success"
        );


        setTimeout(function() {

            if (selectedRole === "admin") {

                window.location.href =
                    "admin.html";

            } else {

                window.location.href =
                    "student.html";

            }

        }, 800);


    } catch (error) {

        console.error(error);


        let message =
            "Unable to login. Please check your details.";


        if (error.code === "auth/invalid-credential") {

            message =
                "Incorrect email or password.";

        }

        if (error.code === "auth/invalid-email") {

            message =
                "Please enter a valid email.";

        }


        showMessage(message, "error");


        loginButton.disabled = false;

        loginButton.textContent = "LOGIN";

    }

});


async function resetPassword() {

    const email =
        document.getElementById("email").value.trim();


    if (!email) {

        showMessage(
            "Enter your email first.",
            "error"
        );

        return;

    }


    try {

        await auth.sendPasswordResetEmail(email);

        showMessage(
            "Password reset email sent.",
            "success"
        );

    } catch (error) {

        showMessage(
            "Unable to send reset email.",
            "error"
        );

    }

}

</script>

</body>

</html>
